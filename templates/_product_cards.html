{% for product in products %}
<div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body">
<h2 class="h5">{{ product['name'] }}</h2><p>{{ product['description'] }}</p>
<p class="fw-bold">${{ '%.2f'|format(product['price']) }}</p>
<form method="post" action="{{ url_for('add_to_cart', product_id=product['id']) }}">
<button class="btn btn-primary">Add to cart</button></form></div></div></div>
{% else %}
<div class="alert alert-warning">No products found.</div>
{% endfor %}
