<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} - MiniMart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container">
<a class="navbar-brand" href="{{ url_for('home') }}">MiniMart</a><div>
<a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('cart') }}">Cart</a>
<a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('admin') }}">Admin</a>
{% if session.get('username') %}
<span class="navbar-text text-white me-3">{{ session.get('username') }} ({{ session.get('role') }})</span>
<a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Logout</a>
{% else %}
<a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Login</a>
{% endif %}
</div></div></nav><main class="container py-4"><h1>{{ self.title() }}</h1>{% block content %}{% endblock %}</main></body></html>
